<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zen Architecture Map</title>
    <style>
      :root {
        color-scheme: dark;
        background: #090e22;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 18% 12%, rgba(143, 184, 255, 0.16), transparent 32rem),
          radial-gradient(circle at 84% 88%, rgba(255, 212, 170, 0.14), transparent 34rem),
          #090e22;
        color: white;
        font-family: Arial, sans-serif;
      }

      header {
        padding: 24px 28px 12px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
      }

      p {
        margin: 8px 0 0;
        color: rgba(255, 255, 255, 0.64);
      }

      .frame {
        padding: 18px 28px 32px;
      }

      .map {
        display: block;
        width: min(100%, 2400px);
        height: auto;
        border-radius: 20px;
        box-shadow: 0 24px 90px rgba(0, 0, 0, 0.35);
      }

      html.export,
      html.export body {
        width: 2400px;
        height: 1608px;
        overflow: hidden;
        background: #0b1028;
      }

      html.export body {
        padding: 0;
      }

      html.export header {
        display: none;
      }

      html.export .frame {
        width: 2400px;
        max-width: none;
        margin: 0;
        padding: 0;
      }

      html.export .map {
        width: 2400px;
        height: 1608px;
        max-width: none;
        border-radius: 0;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <script>
      if (new URLSearchParams(window.location.search).has("export")) {
        document.documentElement.classList.add("export");
      }
    </script>
    <header>
      <h1>Zen Architecture Map</h1>
      <p>Open this file in your browser for better zoom and viewing.</p>
    </header>
    <main class="frame">
      <img class="map" src="./architecture-map.svg" alt="Zen architecture map" />
    </main>
  </body>
</html>
