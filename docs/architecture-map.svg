<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700" role="img" aria-labelledby="title desc">
  <title id="title">Zen Architecture Map</title>
  <desc id="desc">High quality vector architecture map for the Zen app, showing frontend, backend, external services, deploy flow, and product principles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1028"/>
      <stop offset="52%" stop-color="#172546"/>
      <stop offset="100%" stop-color="#263453"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="node" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="nodeAccent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#c5f4ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffe2b8" stop-opacity="0.13"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.26"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10 Z" fill="#dbeafe" opacity="0.82"/>
    </marker>
    <style>
      .title { fill: #ffffff; font: 700 54px Arial, sans-serif; letter-spacing: 0.02em; }
      .subtitle { fill: rgba(255,255,255,0.68); font: 400 25px Arial, sans-serif; }
      .panel-title { fill: rgba(255,255,255,0.86); font: 700 25px Arial, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
      .label { fill: #ffffff; font: 700 23px Arial, sans-serif; }
      .small { fill: rgba(255,255,255,0.70); font: 400 18px Arial, sans-serif; }
      .tiny { fill: rgba(255,255,255,0.55); font: 400 16px Arial, sans-serif; }
      .pill { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.15); stroke-width: 1.4; }
      .panel { fill: url(#panel); stroke: rgba(255,255,255,0.18); stroke-width: 1.5; filter: url(#shadow); }
      .node { fill: url(#node); stroke: rgba(255,255,255,0.20); stroke-width: 1.5; }
      .accent { fill: url(#nodeAccent); stroke: rgba(210,240,255,0.36); stroke-width: 1.7; }
      .fallback { fill: rgba(255,226,184,0.12); stroke: rgba(255,226,184,0.28); stroke-width: 1.5; }
      .arrow { fill: none; stroke: rgba(219,234,254,0.62); stroke-width: 3; marker-end: url(#arrow); }
      .soft-arrow { fill: none; stroke: rgba(219,234,254,0.38); stroke-width: 2.4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="2400" height="1700" fill="url(#bg)"/>
  <circle cx="430" cy="240" r="290" fill="#8fb8ff" opacity="0.08"/>
  <circle cx="2020" cy="1320" r="340" fill="#ffd4aa" opacity="0.09"/>
  <circle cx="1260" cy="830" r="440" fill="#ffffff" opacity="0.035"/>

  <text x="100" y="90" class="title">Zen Architecture Map</text>
  <text x="102" y="132" class="subtitle">Public DEV preview, local development, backend services, Gemini layer, and fallback-first product logic.</text>
  <text x="1990" y="92" class="tiny">DEV 1.27 diagram</text>

  <!-- Top flow -->
  <rect x="1010" y="145" width="380" height="90" rx="24" class="accent"/>
  <text x="1200" y="182" text-anchor="middle" class="label">Bruker</text>
  <text x="1200" y="210" text-anchor="middle" class="small">åpner Zen i nettleser</text>

  <rect x="1010" y="280" width="380" height="90" rx="24" class="node"/>
  <text x="1200" y="318" text-anchor="middle" class="label">Nettleser</text>
  <text x="1200" y="345" text-anchor="middle" class="small">localhost eller GitHub Pages</text>

  <path d="M1200 235 V275" class="arrow"/>

  <!-- Entry points -->
  <rect x="80" y="430" width="540" height="520" rx="34" class="panel"/>
  <text x="130" y="485" class="panel-title">Entry Points</text>

  <rect x="140" y="525" width="420" height="96" rx="22" class="accent"/>
  <text x="350" y="562" text-anchor="middle" class="label">Lokal frontend</text>
  <text x="350" y="590" text-anchor="middle" class="small">http://localhost:3000</text>

  <rect x="140" y="660" width="420" height="110" rx="22" class="accent"/>
  <text x="350" y="698" text-anchor="middle" class="label">GitHub Pages</text>
  <text x="350" y="726" text-anchor="middle" class="small">Public DEV preview</text>
  <text x="350" y="751" text-anchor="middle" class="tiny">simen27u.github.io/Zen</text>

  <rect x="140" y="825" width="195" height="84" rx="20" class="node"/>
  <text x="238" y="858" text-anchor="middle" class="label">localStorage</text>
  <text x="238" y="884" text-anchor="middle" class="tiny">localhost</text>

  <rect x="365" y="825" width="195" height="84" rx="20" class="node"/>
  <text x="463" y="858" text-anchor="middle" class="label">localStorage</text>
  <text x="463" y="884" text-anchor="middle" class="tiny">Pages-domene</text>

  <path d="M1010 325 C760 330, 610 500, 560 560" class="soft-arrow"/>
  <path d="M1010 325 C760 350, 610 650, 560 710" class="soft-arrow"/>
  <path d="M350 621 V820" class="soft-arrow"/>
  <path d="M350 770 C350 795, 400 805, 463 825" class="soft-arrow"/>

  <!-- Frontend core -->
  <rect x="680" y="430" width="610" height="650" rx="34" class="panel"/>
  <text x="730" y="485" class="panel-title">Frontend Core</text>
  <text x="730" y="520" class="small">React / TypeScript / Vite</text>

  <rect x="730" y="560" width="245" height="82" rx="20" class="accent"/>
  <text x="853" y="592" text-anchor="middle" class="label">ZenDayUI.tsx</text>
  <text x="853" y="618" text-anchor="middle" class="tiny">hovedflate og paneler</text>

  <rect x="1000" y="560" width="245" height="82" rx="20" class="node"/>
  <text x="1123" y="592" text-anchor="middle" class="label">AmbientBackdrop</text>
  <text x="1123" y="618" text-anchor="middle" class="tiny">værbakgrunn</text>

  <rect x="730" y="675" width="245" height="82" rx="20" class="node"/>
  <text x="853" y="707" text-anchor="middle" class="label">textSystem.ts</text>
  <text x="853" y="733" text-anchor="middle" class="tiny">lokal tekst/fallback</text>

  <rect x="1000" y="675" width="245" height="82" rx="20" class="node"/>
  <text x="1123" y="707" text-anchor="middle" class="label">rhythm.ts</text>
  <text x="1123" y="733" text-anchor="middle" class="tiny">faser, ankere, steg</text>

  <rect x="730" y="790" width="245" height="82" rx="20" class="node"/>
  <text x="853" y="822" text-anchor="middle" class="label">settings.ts</text>
  <text x="853" y="848" text-anchor="middle" class="tiny">språk og valg</text>

  <rect x="1000" y="790" width="245" height="82" rx="20" class="node"/>
  <text x="1123" y="822" text-anchor="middle" class="label">weatherScene</text>
  <text x="1123" y="848" text-anchor="middle" class="tiny">symbol til scene</text>

  <rect x="730" y="905" width="245" height="82" rx="20" class="node"/>
  <text x="853" y="937" text-anchor="middle" class="label">weatherPalette</text>
  <text x="853" y="963" text-anchor="middle" class="tiny">farger og stemning</text>

  <rect x="1000" y="905" width="245" height="82" rx="20" class="node"/>
  <text x="1123" y="937" text-anchor="middle" class="label">aiTextClient</text>
  <text x="1123" y="963" text-anchor="middle" class="tiny">status og zen-text</text>

  <path d="M560 573 C620 573, 635 600, 730 600" class="arrow"/>
  <path d="M560 715 C625 715, 635 716, 730 716" class="arrow"/>

  <!-- Backend -->
  <rect x="1360" y="430" width="560" height="650" rx="34" class="panel"/>
  <text x="1410" y="485" class="panel-title">Backend</text>
  <text x="1410" y="520" class="small">Node / Express API</text>

  <rect x="1410" y="555" width="210" height="82" rx="20" class="accent"/>
  <text x="1515" y="587" text-anchor="middle" class="label">localhost:3001</text>
  <text x="1515" y="613" text-anchor="middle" class="tiny">lokal backend</text>

  <rect x="1660" y="555" width="210" height="82" rx="20" class="accent"/>
  <text x="1765" y="587" text-anchor="middle" class="label">Render</text>
  <text x="1765" y="613" text-anchor="middle" class="tiny">zen-xyvt.onrender.com</text>

  <rect x="1480" y="685" width="320" height="86" rx="24" class="node"/>
  <text x="1640" y="720" text-anchor="middle" class="label">Express API</text>
  <text x="1640" y="747" text-anchor="middle" class="tiny">CORS + JSON + cache</text>

  <path d="M1515 637 C1515 660, 1570 660, 1600 685" class="soft-arrow"/>
  <path d="M1765 637 C1765 660, 1710 660, 1680 685" class="soft-arrow"/>
  <path d="M560 573 C890 535, 1160 535, 1410 595" class="soft-arrow"/>
  <path d="M560 715 C930 730, 1170 620, 1660 595" class="soft-arrow"/>

  <rect x="1410" y="815" width="220" height="74" rx="18" class="node"/>
  <text x="1520" y="844" text-anchor="middle" class="label">/api/health</text>
  <text x="1520" y="867" text-anchor="middle" class="tiny">server lever</text>

  <rect x="1650" y="815" width="220" height="74" rx="18" class="node"/>
  <text x="1760" y="844" text-anchor="middle" class="label">/api/status</text>
  <text x="1760" y="867" text-anchor="middle" class="tiny">trygg DEV-status</text>

  <rect x="1410" y="920" width="220" height="74" rx="18" class="node"/>
  <text x="1520" y="949" text-anchor="middle" class="label">/api/weather</text>
  <text x="1520" y="972" text-anchor="middle" class="tiny">vær + sted</text>

  <rect x="1650" y="920" width="220" height="74" rx="18" class="node"/>
  <text x="1760" y="949" text-anchor="middle" class="label">/api/holidays</text>
  <text x="1760" y="972" text-anchor="middle" class="tiny">røde dager</text>

  <rect x="1410" y="1025" width="220" height="74" rx="18" class="node"/>
  <text x="1520" y="1054" text-anchor="middle" class="label">/api/local</text>
  <text x="1520" y="1077" text-anchor="middle" class="tiny">Gemini/fallback</text>

  <rect x="1650" y="1025" width="220" height="74" rx="18" class="node"/>
  <text x="1760" y="1054" text-anchor="middle" class="label">/api/zen-text</text>
  <text x="1760" y="1077" text-anchor="middle" class="tiny">rolig tekstvariant</text>

  <path d="M1640 771 V803" class="soft-arrow"/>
  <path d="M1640 771 C1585 790, 1535 795, 1520 815" class="soft-arrow"/>
  <path d="M1640 771 C1695 790, 1745 795, 1760 815" class="soft-arrow"/>

  <!-- External services -->
  <rect x="1980" y="430" width="340" height="650" rx="34" class="panel"/>
  <text x="2028" y="485" class="panel-title">External</text>
  <text x="2028" y="520" class="small">tjenester bak backend</text>

  <rect x="2035" y="565" width="230" height="84" rx="20" class="accent"/>
  <text x="2150" y="597" text-anchor="middle" class="label">MET/Yr</text>
  <text x="2150" y="623" text-anchor="middle" class="tiny">værdata</text>

  <rect x="2035" y="690" width="230" height="84" rx="20" class="accent"/>
  <text x="2150" y="722" text-anchor="middle" class="label">Nominatim</text>
  <text x="2150" y="748" text-anchor="middle" class="tiny">stedsnavn</text>

  <rect x="2035" y="815" width="230" height="84" rx="20" class="node"/>
  <text x="2150" y="847" text-anchor="middle" class="label">API Ninjas</text>
  <text x="2150" y="873" text-anchor="middle" class="tiny">helligdager</text>

  <rect x="2035" y="940" width="230" height="84" rx="20" class="node"/>
  <text x="2150" y="972" text-anchor="middle" class="label">Gemini API</text>
  <text x="2150" y="998" text-anchor="middle" class="tiny">tekst og forslag</text>

  <rect x="2035" y="1040" width="230" height="52" rx="18" class="fallback"/>
  <text x="2150" y="1072" text-anchor="middle" class="small">lokale fallbacks</text>

  <path d="M1630 957 C1745 935, 1880 600, 2035 607" class="arrow"/>
  <path d="M1630 957 C1745 960, 1880 720, 2035 732" class="soft-arrow"/>
  <path d="M1870 957 C1935 940, 1990 870, 2035 857" class="arrow"/>
  <path d="M1630 1062 C1810 1040, 1900 990, 2035 982" class="arrow"/>
  <path d="M1870 1062 C1930 1048, 1988 1000, 2035 982" class="soft-arrow"/>

  <!-- Deploy -->
  <rect x="80" y="1160" width="1050" height="380" rx="34" class="panel"/>
  <text x="130" y="1215" class="panel-title">Deploy og miljø</text>

  <rect x="140" y="1260" width="220" height="82" rx="20" class="accent"/>
  <text x="250" y="1292" text-anchor="middle" class="label">GitHub repo</text>
  <text x="250" y="1318" text-anchor="middle" class="tiny">main + dev-tags</text>

  <rect x="420" y="1260" width="220" height="82" rx="20" class="node"/>
  <text x="530" y="1292" text-anchor="middle" class="label">Actions</text>
  <text x="530" y="1318" text-anchor="middle" class="tiny">bygger frontend</text>

  <rect x="700" y="1260" width="220" height="82" rx="20" class="node"/>
  <text x="810" y="1292" text-anchor="middle" class="label">Pages</text>
  <text x="810" y="1318" text-anchor="middle" class="tiny">public DEV</text>

  <rect x="420" y="1390" width="220" height="82" rx="20" class="node"/>
  <text x="530" y="1422" text-anchor="middle" class="label">Render deploy</text>
  <text x="530" y="1448" text-anchor="middle" class="tiny">kjører backend</text>

  <rect x="700" y="1390" width="340" height="82" rx="20" class="fallback"/>
  <text x="870" y="1422" text-anchor="middle" class="label">Environment</text>
  <text x="870" y="1448" text-anchor="middle" class="tiny">GEMINI, API_NINJAS, ZEN_USER_AGENT</text>

  <path d="M360 1301 H410" class="arrow"/>
  <path d="M640 1301 H690" class="arrow"/>
  <path d="M360 1301 C390 1380, 410 1420, 420 1431" class="soft-arrow"/>
  <path d="M640 1431 H690" class="soft-arrow"/>
  <path d="M810 1260 C780 1090, 650 890, 560 715" class="soft-arrow"/>
  <path d="M530 1390 C750 1190, 1230 760, 1480 727" class="soft-arrow"/>
  <path d="M870 1390 C1140 1240, 1480 940, 1660 637" class="soft-arrow"/>

  <!-- Product principles -->
  <rect x="1230" y="1160" width="1090" height="380" rx="34" class="panel"/>
  <text x="1280" y="1215" class="panel-title">Produktprinsipp</text>

  <rect x="1290" y="1260" width="300" height="96" rx="24" class="accent"/>
  <text x="1440" y="1298" text-anchor="middle" class="label">Regelstyrt kjerne</text>
  <text x="1440" y="1326" text-anchor="middle" class="tiny">tid, vær, rytme, språk, dagtype</text>

  <rect x="1640" y="1260" width="300" height="96" rx="24" class="node"/>
  <text x="1790" y="1298" text-anchor="middle" class="label">KI som hjelpelag</text>
  <text x="1790" y="1326" text-anchor="middle" class="tiny">formulering og variasjon</text>

  <rect x="1990" y="1260" width="270" height="96" rx="24" class="fallback"/>
  <text x="2125" y="1298" text-anchor="middle" class="label">Fallback først</text>
  <text x="2125" y="1326" text-anchor="middle" class="tiny">Zen virker uten KI</text>

  <rect x="1390" y="1410" width="710" height="74" rx="22" class="pill"/>
  <text x="1745" y="1440" text-anchor="middle" class="label">Zen bestemmer hva som passer.</text>
  <text x="1745" y="1466" text-anchor="middle" class="small">Gemini hjelper bare med hvordan det sies.</text>

  <path d="M1590 1308 H1630" class="arrow"/>
  <path d="M1940 1308 H1980" class="arrow"/>
  <path d="M1440 1260 C1370 1120, 1220 960, 1123 716" class="soft-arrow"/>
  <path d="M1790 1260 C1750 1180, 1760 1120, 1760 1099" class="soft-arrow"/>
  <path d="M2125 1260 C2080 1150, 1990 1080, 1870 1062" class="soft-arrow"/>
</svg>
